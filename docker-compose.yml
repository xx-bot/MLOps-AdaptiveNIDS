name: adaptive-nids

services:
  s3:
    image: chrislusf/seaweedfs:4.48
    command: server -dir=/data -ip=s3 -ip.bind=0.0.0.0 -s3 -s3.port=8333 -master.volumeSizeLimitMB=1024 -volume.max=0
    ports:
      - "127.0.0.1:8333:8333"
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY in .env}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:?set S3_SECRET_KEY in .env}
    volumes:
      - s3-data:/data
    restart: unless-stopped

volumes:
  s3-data:
